<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rogue Match-3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,700,1,0" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <h1>Rogue Match-3</h1>
        <p class="sub">随机道具肉鸽 · 纯三消爬塔</p>

        <section class="stats">
          <div class="row"><span>楼层</span><strong id="floor">1/7</strong></div>
          <div class="row"><span>词缀</span><strong id="modifier">-</strong></div>
          <div class="row"><span>目标分数</span><strong id="targetScore">0</strong></div>
          <div class="row"><span>剩余步数</span><strong id="movesLeft">0</strong></div>
          <div class="row"><span>当前层得分</span><strong id="floorScore">0</strong></div>
          <div class="row"><span>总分</span><strong id="score">0</strong></div>
          <div class="row"><span>历史最高层</span><strong id="bestFloor">0</strong></div>
          <div class="row"><span>历史最高分</span><strong id="bestScore">0</strong></div>
          <div class="momentum">
            <span>Momentum</span>
            <div class="bar"><i id="momentumBar"></i></div>
            <strong id="feverTurns">Fever 0</strong>
          </div>
          <div id="bossMeter" class="momentum boss">
            <span>Boss Charge</span>
            <div class="bar"><i id="bossBar"></i></div>
            <strong id="bossSkillHint">-</strong>
          </div>
        </section>

        <section class="toolbox">
          <h2>道具</h2>
          <div id="itemWrap" class="btn-grid"></div>
        </section>

        <div class="actions-row">
          <button id="restartBtn" class="btn danger">重新开局</button>
          <button id="codexBtn" class="btn">图鉴</button>
        </div>
        <div id="modeText" class="mode">模式：普通交换</div>
        <div id="message" class="message">交换相邻宝石，形成三消并击败敌人。</div>
      </aside>

      <main class="board-wrap" id="boardWrap">
        <div id="board" class="board" aria-label="match3 board"></div>
        <div id="fxLayer" class="fx-layer" aria-hidden="true"></div>
      </main>
    </div>

    <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
      <div class="modal">
        <h3 id="overlayTitle">选择道具</h3>
        <p id="overlayDesc">过关后获得随机三消道具或系统强化。</p>
        <div id="choiceWrap" class="choices"></div>
      </div>
    </div>

    <div id="codexModal" class="overlay hidden" role="dialog" aria-modal="true">
      <div class="modal">
        <h3>图鉴统计</h3>
        <p>记录你在所有对局中的触发与使用数据。</p>
        <div id="codexContent" class="codex"></div>
        <div class="actions-row" style="margin-top:10px;">
          <button id="codexCloseBtn" class="btn">关闭</button>
        </div>
      </div>
    </div>

    <script src="./game.js"></script>
  </body>
</html>
